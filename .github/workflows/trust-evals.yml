name: Supplier trust evaluations
on: [push, pull_request]
jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      OFFLINE_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e 'backend[test]'
      - run: python -m pytest backend/tests -q --junitxml=eval-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supplier-evaluation-results
          path: eval-results.xml
